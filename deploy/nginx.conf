# LubanNav nginx 静态站点配置（容器内）
# 单端口 8080：页面、地图数据、静态 JSON API、预计算路线全部同源输出。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json application/javascript
        application/geo+json image/svg+xml application/manifest+json;

    # index.html 每次部署都会变，不缓存
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite 构建产物带内容哈希，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 静态 API 与数据（地点、路线、路网），允许短缓存
    location ~ ^/(api|data)/ {
        add_header Cache-Control "public, max-age=300";
    }

    # 其余资源（webp、音频演示、favicon 等）走默认
    location / {
        try_files $uri /index.html;
    }
}
